      <article class="verify-certificate active" data-page="Zertifikat prüfen">

        <header>
          <h2 class="h2 article-title">Zertifikat prüfen</h2>
        </header>

        <section class="service">
          <div class="verify-card content-card">
            <p class="verify-description">Teilnehmer und Arbeitgeber können die Echtheit eines Zertifikats in Sekundenschnelle anhand der Zertifikat‑ID prüfen.</p>

              <div id="main-content" class="verify-content">
              <div id="loading" class="verify-state hidden"></div>
              <form id="search-form" class="verify-form hidden" novalidate>
                <!-- <label for="certificate-id">Zertifikat‑ID eingeben:</label> -->
                <div class="verify-input-row">
                  <input
                    type="text"
                    id="certificate-id"
                    name="certificate-id"
                    maxlength="20"
                    required
                    pattern="MCL-\d{4}-[A-Z0-9]{6,8}"
                    placeholder="MCL-JJJJ-XXXXXXX z. B. MCL-2026-GLMMEO7"
                    autocomplete="off"
                    spellcheck="false"
                  >
                  <button type="button" id="verify-check" class="verify-check">Prüfen</button>
                </div>
              </form>
              <div id="result" class="verify-result"></div>
            </div>

            <footer class="verify-footer">
              <p>&copy; 2026 MathCodeLab</p>
            </footer>
          </div>
        </section>

      </article>
