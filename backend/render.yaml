services:
  - type: web
    name: mathcodelab.github.io
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: ADMIN_API_KEY
        fromSecret: ADMIN_API_KEY